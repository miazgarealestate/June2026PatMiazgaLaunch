<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pat Miazga — CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1a18; --stone:#3d3d38; --warmmid:#7a7468; --sand:#c8b89a;
    --cream:#f7f4ef; --white:#ffffff; --accent:#8b6f47; --accentdark:#6b5235;
    --border:#e2ddd6; --peerbg:#f0ede8;
    --ok-bg:#f0fdf4; --ok-bd:#86efac; --ok-tx:#166534;
    --soon-bg:#fffbeb; --soon-bd:#fcd34d; --soon-tx:#92400e;
    --late-bg:#fef2f2; --late-bd:#fca5a5; --late-tx:#991b1b;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--cream);color:var(--stone);-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.serif{font-family:'Cormorant Garamond',serif;}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  a{color:inherit;}
  #app{max-width:640px;margin:0 auto;min-height:100vh;background:var(--cream);padding-bottom:78px;position:relative;}

  /* Header */
  .topbar{position:sticky;top:0;z-index:100;background:var(--ink);color:var(--white);padding:14px 18px;display:flex;align-items:center;justify-content:space-between;}
  .topbar .brand{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;}
  .topbar .brand span{color:var(--sand);}
  .bell{position:relative;background:none;border:none;color:var(--white);font-size:20px;padding:4px 6px;}
  .bell .badge{position:absolute;top:-2px;right:-2px;background:#c0392b;color:#fff;font-size:10px;font-weight:700;border-radius:10px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 3px;}

  /* Tabs */
  .tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--border);display:flex;z-index:200;max-width:640px;margin:0 auto;}
  .tabbtn{flex:1;border:none;background:none;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--warmmid);font-size:10.5px;font-weight:600;letter-spacing:.2px;}
  .tabbtn.active{color:var(--accent);}
  .tabbtn .ico{font-size:17px;}

  .view{padding:18px 16px 20px;}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent);margin-bottom:4px;}
  .viewtitle{font-size:26px;font-weight:700;color:var(--ink);margin:0 0 4px;}
  .viewsub{font-size:12.5px;color:var(--warmmid);margin-bottom:16px;}

  .card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}

  .pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.3px;padding:3px 9px;border-radius:20px;color:#fff;}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-size:13px;font-weight:600;}
  .btn:hover{background:var(--accentdark);}
  .btn.ghost{background:none;border:1px solid var(--border);color:var(--stone);}
  .btn.sm{padding:6px 10px;font-size:12px;border-radius:7px;}
  .btn.block{width:100%;}
  .btn.danger{background:#991b1b;}
  .iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--white);display:flex;align-items:center;justify-content:center;font-size:16px;}

  .urg-late{background:var(--late-bg);border:1px solid var(--late-bd);color:var(--late-tx);}
  .urg-soon{background:var(--soon-bg);border:1px solid var(--soon-bd);color:var(--soon-tx);}
  .urg-ok{background:var(--ok-bg);border:1px solid var(--ok-bd);color:var(--ok-tx);}
  .banner{border-radius:9px;padding:10px 12px;font-size:12.5px;font-weight:600;margin-bottom:10px;line-height:1.4;}

  .contact-name{font-size:15.5px;font-weight:700;color:var(--ink);}
  .contact-meta{font-size:11.5px;color:var(--warmmid);margin-top:2px;}
  .section-label{font-size:11px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--warmmid);margin:18px 0 8px;}
  .section-label:first-child{margin-top:0;}
  .empty{text-align:center;color:var(--warmmid);font-size:13px;padding:30px 10px;}

  input,textarea,select{width:100%;font-family:'Inter',sans-serif;font-size:14px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--white);color:var(--stone);}
  label{display:block;font-size:11.5px;font-weight:600;color:var(--warmmid);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.5px;}
  label:first-child{margin-top:0;}

  .filterrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .filterchip{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--border);background:var(--white);color:var(--warmmid);}
  .filterchip.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:400;display:flex;align-items:flex-end;justify-content:center;}
  .modal-sheet{background:var(--cream);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px 40px;}
  .modal-sheet.center{border-radius:16px;max-height:88vh;margin:0 12px;}
  .modal-close{float:right;background:none;border:none;font-size:22px;color:var(--warmmid);line-height:1;}
  .quickrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0;}
  .quickrow .btn{padding:10px 4px;font-size:12px;text-align:center;}

  .histitem{border-left:2px solid var(--border);padding:2px 0 10px 10px;margin-left:4px;font-size:12.5px;}
  .histitem .hd{font-weight:600;color:var(--ink);}
  .histitem .dt{color:var(--warmmid);font-size:11px;}

  .stagegrid{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px;}
  .stagebtn{padding:6px 10px;border-radius:8px;font-size:11.5px;font-weight:600;border:1px solid var(--border);background:var(--white);color:var(--stone);}
  .stagebtn.current{opacity:1;border-width:2px;}

  .scriptcard{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;position:relative;}
  .scriptcard .lbl{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
  .scriptcard .body{font-size:12.5px;color:var(--stone);white-space:pre-wrap;line-height:1.5;background:var(--peerbg);border-radius:7px;padding:8px 9px;}
  .copybtn{position:absolute;top:8px;right:8px;font-size:11px;background:var(--white);border:1px solid var(--border);border-radius:6px;padding:3px 8px;}

  .fab{position:fixed;right:18px;bottom:88px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:26px;box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:150;}
  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:9px 16px;border-radius:20px;z-index:500;opacity:0;transition:opacity .25s;pointer-events:none;}
  .toast.show{opacity:1;}
  .search-wrap{margin-bottom:12px;}
  .settingsblock{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;}
  .settingsblock p{font-size:12.5px;color:var(--warmmid);line-height:1.5;margin:4px 0 10px;}
  .kbd{background:var(--peerbg);border-radius:5px;padding:1px 6px;font-size:11px;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">Pat Miazga <span>CRM</span></div>
    <button class="bell" id="bellBtn" onclick="showView('settings')">🔔<span class="badge" id="bellBadge" style="display:none;">0</span></button>
  </div>
  <div id="viewRoot"></div>
  <button class="fab" onclick="openAddContact()" title="Add contact">+</button>
  <div class="tabbar">
    <button class="tabbtn active" data-tab="today" onclick="showView('today')"><span class="ico">📋</span>Today</button>
    <button class="tabbtn" data-tab="pipeline" onclick="showView('pipeline')"><span class="ico">🧭</span>Pipeline</button>
    <button class="tabbtn" data-tab="sphere" onclick="showView('sphere')"><span class="ico">🤝</span>Sphere</button>
    <button class="tabbtn" data-tab="all" onclick="showView('all')"><span class="ico">👥</span>All</button>
    <button class="tabbtn" data-tab="scripts" onclick="showView('scripts')"><span class="ico">💬</span>Scripts</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   PAT MIAZGA CRM — pure HTML/CSS/JS, no build step required
   Framework: Travis Robertson "The Pipeline Fix" (RE/MAX Growth
   Mindset Series 2026) — two-category model (unknown leads vs
   known sphere), stage cadence standards, never-delete leads.
   Storage: browser localStorage (per device/browser — see
   Settings tab for export/import + reminder options).
   ========================================================= */

const STORAGE_KEY = "patCRM_v1";
const NOTIFY_KEY = "patCRM_notify_v1";
const LAST_CHECK_KEY = "patCRM_lastcheck_v1";

// ---- Stage definitions ----------------------------------------------------
const STAGES = {
  new:      { label:"New Lead",        color:"#7a7468", group:"unknown", cadence:null, standard:"Don't work leads here — move to 3-Day immediately." },
  "3day":   { label:"3-Day Follow-Up", color:"#d97706", group:"unknown", cadence:1,    standard:"2 calls + 2 texts + 2 emails per day, for 3 days." },
  "11day":  { label:"11-Day Follow-Up",color:"#b45309", group:"unknown", cadence:2,    standard:"6 calls + 6 texts + 6 emails spread across 11 days." },
  A:        { label:"A — Active",      color:"#16a34a", group:"unknown", cadence:7,    standard:"Active appointment OR a signed agreement only. Contact every 7 days." },
  B:        { label:"B — 90 Days",     color:"#2563eb", group:"unknown", cadence:15,   standard:"Buying/selling in 90–100 days. Contact every 15 days." },
  C:        { label:"C — 12 Months",   color:"#8b6f47", group:"unknown", cadence:30,   standard:"Buying/selling in 4–12 months. Contact every 30 days." },
  pond:     { label:"Prospect Pond",   color:"#94a3b8", group:"unknown", cadence:60,   standard:"Automated nurture. Watch for re-engagement triggers (opens, replies, guide re-downloads)." },
  "bad-lead":{label:"Bad Contact Info",color:"#57534e", group:"unknown", cadence:null, standard:"Never delete a lead — park bad info here instead." },
  top50:    { label:"Top 50",          color:"#7c3aed", group:"known",   cadence:30,   standard:"Your inner circle. Contact every 30 days, no exceptions." },
  top100:   { label:"Top 100",         color:"#9333ea", group:"known",   cadence:90,   standard:"Wider sphere. Contact every 90 days." },
  sphere:   { label:"General Sphere",  color:"#a78bfa", group:"known",   cadence:null, standard:"Everyone else you know. No fixed cadence — nurture opportunistically." },
};
const UNKNOWN_ORDER = ["new","3day","11day","A","B","C","pond","bad-lead"];
const KNOWN_ORDER = ["top50","top100","sphere"];
// Priority order for the Today view
const TODAY_PRIORITY = ["A","top50","3day","11day","B","top100","C","pond","sphere"];

// Guidance shown when moving INTO a stage (esp. A, which needs a hard confirm)
const STAGE_GUIDANCE = {
  A: "Only move a contact to A if they have a signed buyer/listing agreement OR an active, scheduled appointment. This is not a temperature — it's a commitment. Confirm before continuing.",
  "bad-lead": "This contact is never deleted — just parked here as unreachable. You can always tag it active again if new info comes in.",
  top50: "Top 50 gets contacted every 30 days without exception. Only add people you're confident you can sustain that with.",
};

// ---- Script library (Pat's voice) -----------------------------------------
const SCRIPTS = {
  "3day":[
    {label:"Voicemail",content:"Hey, it's Pat Miazga with RE/MAX All Points Realty. I saw you grabbed one of my South Okanagan guides — just wanted to say hi and see what you're working through. No pressure at all, call or text me back whenever, 604-562-5982."},
    {label:"Text",content:"Hi, it's Pat Miazga — RE/MAX. Thanks for downloading the guide. Happy to answer anything, no agenda. What's on your mind about the move?"},
    {label:"Email",subject:"Quick hello from Pat Miazga",content:"Hi {{firstName}},\n\nPat here — I saw you downloaded one of my South Okanagan guides. I made the same move myself from the Lower Mainland, so if you've got questions about the area, timing, or anything real-estate-related, I'm an easy person to ask.\n\nNo pressure, no pitch — just reply whenever it's useful.\n\nPat Miazga\nRE/MAX All Points Realty\n604-562-5982"},
  ],
  "11day":[
    {label:"Voicemail",content:"Hi, Pat Miazga again from RE/MAX. Still happy to help whenever you're ready to talk South Okanagan — no rush on my end. Give me a shout, 604-562-5982."},
    {label:"Text",content:"Hey, it's Pat again. Still around whenever you want to talk through the South Okanagan — even just questions about areas or timing."},
    {label:"Email",subject:"Still here whenever you're ready",content:"Hi {{firstName}},\n\nJust circling back — I know these decisions take time, especially moving somewhere new. If it'd help to talk through neighbourhoods, pricing, or timing, I'm glad to jump on a quick call.\n\nPat Miazga\nRE/MAX All Points Realty\n604-562-5982"},
  ],
  A:[
    {label:"Check-in call opener",content:"Hey it's Pat — just checking in on where things stand with [property/listing]. Anything come up since we last talked?"},
    {label:"Text",content:"Hi, quick check-in — anything new on your end since we last spoke? Happy to hop on a call if useful."},
  ],
  B:[
    {label:"Text",content:"Hey, it's Pat — just touching base since it's been a couple weeks. Still on track for [timeframe]? Let me know if anything's changed."},
    {label:"Email",subject:"Checking in",content:"Hi {{firstName}},\n\nJust a quick check-in since we last talked — still tracking toward [timeframe]? Market's moved a bit since then, happy to send you an update if useful.\n\nPat"},
  ],
  C:[
    {label:"Text",content:"Hey, it's Pat — hope things are good. No pressure, just wanted to stay on your radar for whenever the timing's right."},
  ],
  pond:[
    {label:"Automated nurture note",content:"No manual touch required — this contact should be on an automated email/content nurture. Watch for opens, replies, or guide re-downloads as a re-engagement trigger to pull them back into active pipeline."},
  ],
  top50:[
    {label:"Monthly check-in",content:"Hey [name], it's Pat — just calling to catch up, not about real estate at all. How's everything going with you and the family?"},
  ],
  top100:[
    {label:"Quarterly touch",content:"Hey [name], it's been a while — thinking of you, hope things are going well. Let me know if you ever want to catch up."},
  ],
  sphere:[
    {label:"General reconnect",content:"Hey [name], long time! Just wanted to reach out and say hi — how have you been?"},
  ],
};

// ---- State ------------------------------------------------------------------
let contacts = [];
let currentView = "today";
let currentFilter = null;
let searchTerm = "";
let openContactId = null;

function loadContacts(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    contacts = raw ? JSON.parse(raw) : [];
  }catch(e){ contacts = []; }
}
function saveContacts(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(contacts));
  refreshBadge();
}
function uid(){ return "c_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

function daysSince(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr);
  const diff = Math.floor((Date.now()-d.getTime())/86400000);
  return diff;
}
function getUrgency(contact){
  const info = STAGES[contact.stage];
  if(!info || info.cadence==null) return null;
  const ago = daysSince(contact.lastContact);
  if(ago==null) return "late"; // never contacted
  if(ago >= info.cadence) return "late";
  if(ago >= info.cadence - 3) return "soon";
  return "ok";
}
function urgencyRank(u){ return u==="late"?0:u==="soon"?1:u==="ok"?2:3; }

function fmtDate(dateStr){
  if(!dateStr) return "never";
  const d = new Date(dateStr);
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
}

// ---- Toast ------------------------------------------------------------------
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
}

// ---- Views --------------------------------------------------------------
function showView(view){
  currentView = view;
  currentFilter = null;
  document.querySelectorAll(".tabbtn").forEach(b=>b.classList.toggle("active", b.dataset.tab===view));
  render();
}

function render(){
  const root = document.getElementById("viewRoot");
  if(currentView==="today") root.innerHTML = renderToday();
  else if(currentView==="pipeline") root.innerHTML = renderGroup("unknown","Pipeline","Leads you don't know yet — worked by stage cadence.");
  else if(currentView==="sphere") root.innerHTML = renderGroup("known","Sphere","People you already know.");
  else if(currentView==="all") root.innerHTML = renderAll();
  else if(currentView==="scripts") root.innerHTML = renderScripts();
  else if(currentView==="settings") root.innerHTML = renderSettings();
  attachDynamicHandlers();
}

function renderToday(){
  const due = contacts.filter(c=>{
    const u = getUrgency(c);
    return u==="late" || u==="soon";
  });
  due.sort((a,b)=>{
    const ua=getUrgency(a), ub=getUrgency(b);
    if(urgencyRank(ua)!==urgencyRank(ub)) return urgencyRank(ua)-urgencyRank(ub);
    return TODAY_PRIORITY.indexOf(a.stage) - TODAY_PRIORITY.indexOf(b.stage);
  });
  const threeDayNew = contacts.filter(c=>c.stage==="new");

  let html = `<div class="view">
    <div class="eyebrow">Daily Action List</div>
    <h1 class="viewtitle">Today</h1>
    <div class="viewsub">${due.length} contact${due.length===1?"":"s"} due or overdue, sorted by priority (A → Top 50 → 3-Day → …)</div>`;

  if(threeDayNew.length){
    html += `<div class="banner urg-soon">⚡ ${threeDayNew.length} brand-new lead${threeDayNew.length===1?"":"s"} sitting in "New" — move to 3-Day and start working today. Don't let leads age in New.</div>`;
  }

  if(due.length===0){
    html += `<div class="empty">Nothing due right now. 🎉<br>Add contacts with the + button or check Pipeline / Sphere.</div>`;
  } else {
    due.forEach(c=>{ html += contactRowHTML(c, true); });
  }
  html += `</div>`;
  return html;
}

function renderGroup(group, title, sub){
  const order = group==="unknown" ? UNKNOWN_ORDER : KNOWN_ORDER;
  let html = `<div class="view">
    <div class="eyebrow">Pipeline</div>
    <h1 class="viewtitle">${title}</h1>
    <div class="viewsub">${sub}</div>
    <div class="filterrow">
      <button class="filterchip ${currentFilter===null?'active':''}" data-filter="">All</button>
      ${order.map(s=>`<button class="filterchip ${currentFilter===s?'active':''}" data-filter="${s}">${STAGES[s].label}</button>`).join("")}
    </div>`;

  const stagesToShow = currentFilter ? [currentFilter] : order;
  let any = false;
  stagesToShow.forEach(stage=>{
    const list = contacts.filter(c=>c.stage===stage);
    if(!list.length) return;
    any = true;
    html += `<div class="section-label">${STAGES[stage].label} (${list.length})</div>`;
    list.forEach(c=>{ html += contactRowHTML(c); });
  });
  if(!any) html += `<div class="empty">No contacts in this view yet.</div>`;
  html += `</div>`;
  return html;
}

function renderAll(){
  let html = `<div class="view">
    <div class="eyebrow">Full Database</div>
    <h1 class="viewtitle">All Contacts</h1>
    <div class="viewsub">${contacts.length} total</div>
    <div class="search-wrap"><input type="text" id="searchInput" placeholder="Search name, phone, email, source..." value="${escapeAttr(searchTerm)}"></div>`;
  const term = searchTerm.toLowerCase();
  const filtered = contacts.filter(c=>{
    if(!term) return true;
    return (c.name||"").toLowerCase().includes(term) ||
           (c.phone||"").toLowerCase().includes(term) ||
           (c.email||"").toLowerCase().includes(term) ||
           (c.source||"").toLowerCase().includes(term);
  }).sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  html += `<div class="viewsub">${filtered.length} shown</div>`;
  if(!filtered.length) html += `<div class="empty">No contacts found.</div>`;
  filtered.forEach(c=>{ html += contactRowHTML(c); });
  html += `</div>`;
  return html;
}

function renderScripts(){
  let html = `<div class="view">
    <div class="eyebrow">Travis Robertson Framework</div>
    <h1 class="viewtitle">Script Library</h1>
    <div class="viewsub">Written in Pat's voice. Tap "Copy" to grab any script.</div>`;
  const groups = [
    {label:"New Leads — Unknown", stages:["3day","11day"]},
    {label:"Active Pipeline", stages:["A","B","C","pond"]},
    {label:"Sphere of Influence", stages:["top50","top100","sphere"]},
  ];
  groups.forEach(g=>{
    html += `<div class="section-label">${g.label}</div>`;
    g.stages.forEach(stage=>{
      const scripts = SCRIPTS[stage];
      if(!scripts) return;
      html += `<div style="font-size:12.5px;font-weight:700;color:${STAGES[stage].color};margin:8px 0 6px;">${STAGES[stage].label}</div>`;
      scripts.forEach((s,i)=>{
        const scriptId = stage+"_"+i;
        html += `<div class="scriptcard">
          <button class="copybtn" data-copy="${scriptId}">Copy</button>
          <div class="lbl">${s.label}</div>
          ${s.subject?`<div style="font-size:11.5px;font-weight:600;color:var(--accent);margin-bottom:4px;">Subject: ${escapeHtml(s.subject)}</div>`:""}
          <div class="body" id="script_${scriptId}">${escapeHtml(s.content)}</div>
        </div>`;
      });
    });
  });
  html += `</div>`;
  return html;
}

function renderSettings(){
  const notifyOn = localStorage.getItem(NOTIFY_KEY)==="on";
  const permission = ("Notification" in window) ? Notification.permission : "unsupported";
  let html = `<div class="view">
    <div class="eyebrow">Reminders &amp; Data</div>
    <h1 class="viewtitle">Settings</h1>
    <div class="viewsub">This CRM runs entirely in your browser — no server, no monthly fee.</div>

    <div class="settingsblock">
      <h3 style="margin:0 0 4px;font-size:16px;">Browser reminders</h3>
      <p>Turns on a check for overdue/due-soon contacts while this tab is open (checks every 30 min, plus once when you open the app). Your browser will need to allow notifications for this site.</p>
      <button class="btn ${notifyOn?'ghost':''}" id="notifyToggle">${notifyOn?"Turn off reminders":"Turn on reminders"}</button>
      <div style="font-size:11.5px;color:var(--warmmid);margin-top:8px;">Permission status: ${permission}</div>
    </div>

    <div class="settingsblock">
      <h3 style="margin:0 0 4px;font-size:16px;">Email me today's list</h3>
      <p>One tap opens an email (from your default mail app) to yourself with everyone due or overdue today — an easy manual daily habit if you'd rather not rely on the browser being open.</p>
      <button class="btn" id="emailTodayBtn">Draft today's email</button>
    </div>

    <div class="settingsblock">
      <h3 style="margin:0 0 4px;font-size:16px;">Backup / move between devices</h3>
      <p>Contacts are saved only in this browser on this device. Export before switching computers or phones, and import to bring them over.</p>
      <div style="display:flex;gap:8px;">
        <button class="btn ghost" style="flex:1;" id="exportBtn">Export backup (.json)</button>
        <button class="btn ghost" style="flex:1;" id="importBtn">Import backup</button>
      </div>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
    </div>

    <div class="settingsblock">
      <h3 style="margin:0 0 4px;font-size:16px;">Why not fully automatic?</h3>
      <p>This CRM is a static file (hosted on GitHub Pages, same as the rest of the site) — there's no server running in the background, so it can't text or email you on a schedule while your browser is closed. The two options above cover it: browser reminders while you're working, and a one-tap email digest for a daily habit. If you ever want true always-on automation (texts/emails sent even when you're not at your computer), that needs a small backend or a service like Zapier/Make watching a shared sheet — happy to scope that separately if it becomes worth the monthly cost.</p>
    </div>
  </div>`;
  return html;
}

function contactRowHTML(c, showActions){
  const info = STAGES[c.stage] || {};
  const urg = getUrgency(c);
  const urgClass = urg==="late" ? "urg-late" : urg==="soon" ? "urg-soon" : urg==="ok" ? "urg-ok" : "";
  const ago = daysSince(c.lastContact);
  const agoText = ago==null ? "never contacted" : ago===0 ? "contacted today" : `last contact ${ago}d ago`;
  return `<div class="card ${urgClass}" data-open="${c.id}">
    <div class="row">
      <div>
        <div class="contact-name">${escapeHtml(c.name||"(no name)")}</div>
        <div class="contact-meta">${agoText}${c.source?` · from ${escapeHtml(c.source)}`:""}</div>
      </div>
      <span class="pill" style="background:${info.color||'#999'};">${info.label||c.stage}</span>
    </div>
    ${showActions ? `<div class="quickrow">
      <a class="btn sm" href="tel:${escapeAttr(c.phone||'')}" data-quicklog="${c.id}:call" onclick="event.stopPropagation();">📞 Call</a>
      <a class="btn sm" href="sms:${escapeAttr(c.phone||'')}" data-quicklog="${c.id}:text" onclick="event.stopPropagation();">💬 Text</a>
      <a class="btn sm" href="mailto:${escapeAttr(c.email||'')}" data-quicklog="${c.id}:email" onclick="event.stopPropagation();">✉️ Email</a>
    </div>` : ""}
  </div>`;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

// ---- Dynamic handlers (re-attached after every render) ---------------------
function attachDynamicHandlers(){
  document.querySelectorAll("[data-open]").forEach(el=>{
    el.addEventListener("click", ()=> openContact(el.dataset.open));
  });
  document.querySelectorAll("[data-quicklog]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const [id, method] = el.dataset.quicklog.split(":");
      // Log after a short delay so the tel:/sms:/mailto: link still fires
      setTimeout(()=>{
        logContact(id, method, "");
        toast("Logged "+method);
        render();
      }, 300);
    });
  });
  document.querySelectorAll(".filterchip").forEach(el=>{
    el.addEventListener("click", ()=>{
      currentFilter = el.dataset.filter || null;
      render();
    });
  });
  const searchInput = document.getElementById("searchInput");
  if(searchInput){
    searchInput.addEventListener("input", (e)=>{
      searchTerm = e.target.value;
      render();
      setTimeout(()=>{
        const si = document.getElementById("searchInput");
        if(si){ si.focus(); si.selectionStart = si.selectionEnd = si.value.length; }
      },0);
    });
  }
  document.querySelectorAll("[data-copy]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const id = el.dataset.copy;
      const text = document.getElementById("script_"+id).textContent;
      navigator.clipboard.writeText(text).then(()=>toast("Script copied")).catch(()=>toast("Couldn't copy — select manually"));
    });
  });
  const notifyToggle = document.getElementById("notifyToggle");
  if(notifyToggle){
    notifyToggle.addEventListener("click", async ()=>{
      const isOn = localStorage.getItem(NOTIFY_KEY)==="on";
      if(isOn){
        localStorage.setItem(NOTIFY_KEY,"off");
        toast("Reminders off");
      } else {
        if("Notification" in window){
          const perm = await Notification.requestPermission();
          if(perm==="granted"){
            localStorage.setItem(NOTIFY_KEY,"on");
            toast("Reminders on");
          } else {
            toast("Notifications blocked in browser settings");
          }
        } else {
          toast("Notifications not supported in this browser");
        }
      }
      render();
    });
  }
  const emailTodayBtn = document.getElementById("emailTodayBtn");
  if(emailTodayBtn) emailTodayBtn.addEventListener("click", emailTodaysList);
  const exportBtn = document.getElementById("exportBtn");
  if(exportBtn) exportBtn.addEventListener("click", exportData);
  const importBtn = document.getElementById("importBtn");
  const importFile = document.getElementById("importFile");
  if(importBtn) importBtn.addEventListener("click", ()=>importFile.click());
  if(importFile) importFile.addEventListener("change", importData);
}

function emailTodaysList(){
  const due = contacts.filter(c=>{ const u=getUrgency(c); return u==="late"||u==="soon"; });
  due.sort((a,b)=>{
    const ua=getUrgency(a), ub=getUrgency(b);
    if(urgencyRank(ua)!==urgencyRank(ub)) return urgencyRank(ua)-urgencyRank(ub);
    return TODAY_PRIORITY.indexOf(a.stage) - TODAY_PRIORITY.indexOf(b.stage);
  });
  let body = "Today's follow-ups (" + new Date().toLocaleDateString() + "):\n\n";
  if(!due.length) body += "Nothing due today.";
  due.forEach(c=>{
    const info = STAGES[c.stage]||{};
    body += `- ${c.name||"(no name)"} [${info.label||c.stage}] — ${c.phone||""} ${c.email||""}\n`;
  });
  const mailto = `mailto:miazgarealestate@gmail.com?subject=${encodeURIComponent("CRM — today's follow-ups")}&body=${encodeURIComponent(body)}`;
  window.location.href = mailto;
}

function exportData(){
  const blob = new Blob([JSON.stringify(contacts,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "pat-crm-backup-"+new Date().toISOString().slice(0,10)+".json";
  a.click();
  URL.revokeObjectURL(url);
  toast("Backup downloaded");
}
function importData(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const imported = JSON.parse(reader.result);
      if(!Array.isArray(imported)) throw new Error("bad format");
      const existingIds = new Set(contacts.map(c=>c.id));
      let added=0;
      imported.forEach(c=>{ if(!existingIds.has(c.id)){ contacts.push(c); added++; } });
      saveContacts();
      toast(`Imported ${added} new contact(s)`);
      render();
    }catch(err){
      toast("Import failed — file isn't a valid backup");
    }
  };
  reader.readAsText(file);
}

// ---- Contact modal ----------------------------------------------------------
function openContact(id){
  openContactId = id;
  const c = contacts.find(x=>x.id===id);
  if(!c) return;
  const info = STAGES[c.stage]||{};
  const urg = getUrgency(c);
  const ago = daysSince(c.lastContact);
  let banner = "";
  if(urg==="late") banner = `<div class="banner urg-late">⚠️ Overdue — standard is every ${info.cadence} days. Reach out today.</div>`;
  else if(urg==="soon") banner = `<div class="banner urg-soon">🔔 Due soon — last touch was ${ago}d ago (standard: ${info.cadence}d)</div>`;
  else if(urg==="ok") banner = `<div class="banner urg-ok">✓ On track — last contact ${ago}d ago</div>`;

  const history = (c.history||[]).slice().reverse();
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.id = "contactBackdrop";
  backdrop.innerHTML = `<div class="modal-sheet">
    <button class="modal-close" id="closeModal">&times;</button>
    <div class="contact-name" style="font-size:20px;">${escapeHtml(c.name||"(no name)")}</div>
    <div class="contact-meta" style="margin-bottom:10px;">${c.phone?escapeHtml(c.phone)+' · ':''}${c.email?escapeHtml(c.email):''}</div>
    <span class="pill" style="background:${info.color};">${info.label}</span>
    <div style="font-size:11.5px;color:var(--warmmid);margin-top:8px;line-height:1.4;">${info.standard||""}</div>
    <div style="margin-top:12px;">${banner}</div>

    <div class="quickrow">
      <a class="btn sm" href="tel:${escapeAttr(c.phone||'')}" data-modallog="call">📞 Call</a>
      <a class="btn sm" href="sms:${escapeAttr(c.phone||'')}" data-modallog="text">💬 Text</a>
      <a class="btn sm" href="mailto:${escapeAttr(c.email||'')}" data-modallog="email">✉️ Email</a>
    </div>

    <label>Move to stage</label>
    <div class="stagegrid">
      ${[...UNKNOWN_ORDER, ...KNOWN_ORDER].map(s=>`<button class="stagebtn ${s===c.stage?'current':''}" style="${s===c.stage?`border-color:${STAGES[s].color};color:${STAGES[s].color};`:''}" data-stagemove="${s}">${STAGES[s].label}</button>`).join("")}
    </div>

    <label>Notes</label>
    <textarea id="notesField" rows="3">${escapeHtml(c.notes||"")}</textarea>
    <button class="btn ghost block" id="saveNotesBtn" style="margin-top:6px;">Save notes</button>

    <label>Source guide / page</label>
    <input type="text" id="sourceField" value="${escapeAttr(c.source||"")}" placeholder="e.g. Osoyoos Living Guide">
    <button class="btn ghost block" id="saveSourceBtn" style="margin-top:6px;">Save source</button>

    <label>History</label>
    <div id="historyList">
      ${history.length ? history.map(h=>`<div class="histitem"><div class="hd">${h.method}${h.note?': '+escapeHtml(h.note):''}</div><div class="dt">${fmtDate(h.date)}</div></div>`).join("") : '<div style="font-size:12px;color:var(--warmmid);">No activity logged yet.</div>'}
    </div>

    <button class="btn danger block" id="archiveBtn" style="margin-top:16px;">Archive (mark as Bad Contact Info)</button>
  </div>`;
  document.body.appendChild(backdrop);

  document.getElementById("closeModal").onclick = closeModal;
  backdrop.addEventListener("click",(e)=>{ if(e.target===backdrop) closeModal(); });
  backdrop.querySelectorAll("[data-modallog]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const method = el.dataset.modallog;
      setTimeout(()=>{
        logContact(c.id, method, "");
        toast("Logged "+method);
        closeModal(); openContact(c.id);
      },300);
    });
  });
  backdrop.querySelectorAll("[data-stagemove]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const stage = el.dataset.stagemove;
      if(stage===c.stage) return;
      const guidance = STAGE_GUIDANCE[stage];
      if(guidance){
        if(!confirm(guidance+"\n\nMove "+(c.name||"this contact")+" to "+STAGES[stage].label+"?")) return;
      }
      c.stage = stage;
      saveContacts();
      toast("Moved to "+STAGES[stage].label);
      closeModal(); openContact(c.id);
    });
  });
  document.getElementById("saveNotesBtn").onclick = ()=>{
    c.notes = document.getElementById("notesField").value;
    saveContacts();
    toast("Notes saved");
  };
  document.getElementById("saveSourceBtn").onclick = ()=>{
    c.source = document.getElementById("sourceField").value;
    saveContacts();
    toast("Source saved");
  };
  document.getElementById("archiveBtn").onclick = ()=>{
    if(!confirm("Park this contact as Bad Contact Info? (It will never be deleted, just moved out of active pipeline.)")) return;
    c.stage = "bad-lead";
    saveContacts();
    toast("Archived");
    closeModal();
    render();
  };
}
function closeModal(){
  const b = document.getElementById("contactBackdrop");
  if(b) b.remove();
}

function logContact(id, method, note){
  const c = contacts.find(x=>x.id===id);
  if(!c) return;
  c.lastContact = new Date().toISOString();
  c.history = c.history || [];
  c.history.push({date:c.lastContact, method, note});
  // Auto-advance new -> 3day on first contact
  if(c.stage==="new") c.stage = "3day";
  saveContacts();
}

// ---- Add contact modal -------------------------------------------------
function openAddContact(){
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.id = "addBackdrop";
  backdrop.innerHTML = `<div class="modal-sheet center">
    <button class="modal-close" id="closeAdd">&times;</button>
    <h2 style="margin:0 0 12px;font-size:20px;">Add Contact</h2>
    <label>Name *</label>
    <input type="text" id="addName" placeholder="Full name">
    <label>Phone</label>
    <input type="tel" id="addPhone" placeholder="604-555-1234">
    <label>Email</label>
    <input type="email" id="addEmail" placeholder="name@example.com">
    <label>Do you know them?</label>
    <select id="addGroup">
      <option value="unknown">No — new lead</option>
      <option value="known">Yes — sphere contact</option>
    </select>
    <label>Starting stage</label>
    <select id="addStage"></select>
    <label>Source guide / page (optional)</label>
    <input type="text" id="addSource" placeholder="e.g. First-Time Buyer's Guide">
    <button class="btn block" id="saveAddBtn" style="margin-top:16px;">Add contact</button>
  </div>`;
  document.body.appendChild(backdrop);
  const groupSel = document.getElementById("addGroup");
  const stageSel = document.getElementById("addStage");
  function populateStages(){
    const order = groupSel.value==="unknown" ? UNKNOWN_ORDER : KNOWN_ORDER;
    stageSel.innerHTML = order.map(s=>`<option value="${s}">${STAGES[s].label}</option>`).join("");
  }
  populateStages();
  groupSel.addEventListener("change", populateStages);
  document.getElementById("closeAdd").onclick = ()=>backdrop.remove();
  backdrop.addEventListener("click",(e)=>{ if(e.target===backdrop) backdrop.remove(); });
  document.getElementById("saveAddBtn").onclick = ()=>{
    const name = document.getElementById("addName").value.trim();
    if(!name){ toast("Name is required"); return; }
    const c = {
      id: uid(),
      name,
      phone: document.getElementById("addPhone").value.trim(),
      email: document.getElementById("addEmail").value.trim(),
      stage: stageSel.value,
      source: document.getElementById("addSource").value.trim(),
      notes: "",
      lastContact: null,
      createdAt: new Date().toISOString(),
      history: [],
    };
    contacts.push(c);
    saveContacts();
    backdrop.remove();
    render();
    toast("Added "+name);
  };
}

// ---- Reminder engine (in-tab) ------------------------------------------
function refreshBadge(){
  const due = contacts.filter(c=>{ const u=getUrgency(c); return u==="late"||u==="soon"; });
  const badge = document.getElementById("bellBadge");
  if(due.length>0){
    badge.style.display="flex";
    badge.textContent = due.length>99?"99+":due.length;
    document.title = `(${due.length}) Pat Miazga CRM`;
  } else {
    badge.style.display="none";
    document.title = "Pat Miazga — CRM";
  }
  return due.length;
}

function checkReminders(force){
  const notifyOn = localStorage.getItem(NOTIFY_KEY)==="on";
  const count = refreshBadge();
  if(!notifyOn) return;
  const lastCheck = localStorage.getItem(LAST_CHECK_KEY);
  const now = Date.now();
  if(!force && lastCheck && (now - Number(lastCheck)) < 29*60*1000) return; // throttle to ~30min
  localStorage.setItem(LAST_CHECK_KEY, String(now));
  if(count>0 && "Notification" in window && Notification.permission==="granted"){
    new Notification("Pat Miazga CRM", { body: `${count} contact${count===1?"":"s"} due or overdue today.` });
  }
}

// ---- Init -----------------------------------------------------------------
function init(){
  loadContacts();
  render();
  refreshBadge();
  setTimeout(()=>checkReminders(true), 1500);
  setInterval(()=>checkReminders(false), 30*60*1000);
}
document.addEventListener("DOMContentLoaded", init);
</script>
